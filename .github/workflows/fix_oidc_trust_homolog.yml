name: Fix OIDC Trust Homolog

on:
  workflow_dispatch:
  push:
    branches:
      - homolog

jobs:
  update-trust-policy:
    name: Update GithubActionsRole trust
    environment:
      name: ${{ github.ref_name }}
    if: github.ref_name == 'homolog'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set homolog account
        run: echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_HOML }}" >> "$GITHUB_ENV"

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          role-session-name: fix-oidc-trust-homolog
          retry-max-attempts: 2

      - name: Add immutable organization subject
        run: |
          set -euo pipefail

          ROLE_NAME="GithubActionsRole"
          SUBJECT_KEY="token.actions.githubusercontent.com:sub"
          NEW_SUBJECT="repo:Maua-Dev@73619687/*"

          aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.AssumeRolePolicyDocument' \
            --output json > trust-current.json

          MATCHES="$(jq --arg key "$SUBJECT_KEY" \
            '[.Statement[] | select((.Condition.StringLike // {}) | has($key))] | length' \
            trust-current.json)"

          if [[ "$MATCHES" -eq 0 ]]; then
            echo "No StringLike condition found for ${SUBJECT_KEY}; refusing to rewrite policy."
            cat trust-current.json
            exit 1
          fi

          jq --arg key "$SUBJECT_KEY" --arg subject "$NEW_SUBJECT" '
            .Statement |= map(
              if ((.Condition.StringLike // {}) | has($key)) then
                .Condition.StringLike[$key] |= (
                  (if type == "array" then . else [.] end)
                  | if index($subject) then . else . + [$subject] end
                )
              else
                .
              end
            )
          ' trust-current.json > trust-updated.json

          if cmp -s trust-current.json trust-updated.json; then
            echo "Trust policy already contains ${NEW_SUBJECT}."
          else
            aws iam update-assume-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-document file://trust-updated.json
            echo "Trust policy updated with ${NEW_SUBJECT}."
          fi

          echo "Final trust policy:"
          aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.AssumeRolePolicyDocument' \
            --output json
